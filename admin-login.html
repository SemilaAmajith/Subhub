<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - SubHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* SpaceFed Aesthetic Overrides for Admin Login */
        body {
            background-color: #0b0c10 !important;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.05) 0%, transparent 50%), radial-gradient(circle at 100% 100%, rgba(255, 0, 127, 0.05) 0%, transparent 50%) !important;
            color: #e0e6ed !important;
            font-family: 'Outfit', sans-serif !important;
        }

        .login-container {
            background: #161a25 !important;
            border-radius: 16px !important;
            border: 1px solid rgba(0, 229, 255, 0.2) !important;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.1) !important;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00e5ff, #ff007f) !important;
        }

        .login-header h2 {
            color: #fff !important;
            font-size: 2rem !important;
        }

        .login-header p {
            color: #8b95a5 !important;
        }

        .form-input {
            background: rgba(255, 255, 255, 0.03) !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            color: #fff !important;
            border-radius: 10px !important;
        }

        .form-input:focus {
            border-color: rgba(0, 229, 255, 0.4) !important;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.1) !important;
        }

        .login-btn {
            background: linear-gradient(90deg, #00e5ff, #0088ff) !important;
            border: none !important;
            color: #000 !important;
            font-weight: 700 !important;
            letter-spacing: 0.5px !important;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3) !important;
        }

        .login-btn:hover {
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.5) !important;
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="dark-theme">
    <div class="auth-container">
        <div class="auth-card" style="border-top: 4px solid var(--danger);">
            <h2><i class="fas fa-shield-alt" style="color: var(--danger);"></i> Admin Portal</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Authorized Access Only</p>

            <form id="adminLoginForm">
                <div class="form-group">
                    <input type="email" id="adminEmail" class="form-input" placeholder="Admin Email" required>
                </div>
                <div class="form-group pwd-wrapper">
                    <input type="password" id="adminPassword" class="form-input" placeholder="Admin Password" required>
                    <i class="fas fa-eye pwd-toggle-icon" onclick="togglePassword(this, 'adminPassword')"></i>
                </div>
                <button type="submit" class="cta-btn primary-cta"
                    style="width: 100%; justify-content: center; background: linear-gradient(135deg, #ff4757 0%, #ff007f 100%); border:none; padding:15px; border-radius:12px; color:#fff; font-weight:600; font-size:1.1rem; cursor:pointer; margin-top: 10px;">
                    Secure Login
                </button>
            </form>
            <div style="margin-top: 20px;">
                <a href="index.html" style="color: var(--text-muted); font-size: 0.9rem;"><i
                        class="fas fa-arrow-left"></i> Back to Site</a>
            </div>
        </div>
    </div>

    <script src="js/db.js"></script>
    
    <script src="js/admin-login.js"></script>
</body>

</html>
